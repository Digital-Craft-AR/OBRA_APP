# Supabase CLI — Obra monorepo (migrations + Edge Functions).
# Docs: https://supabase.com/docs/guides/cli/config

project_id = "obra_app"

[api]
enabled = true

[db]
# Match linked project (see `supabase link` / `.temp/postgres-version` after link).
major_version = 17

# verify_jwt = false — Mercado Pago webhook: validated with x-signature HMAC, no JWT.
[functions.mercadopago-webhook]
verify_jwt = false

# verify_jwt = false — Supabase Auth internal hook: called by Supabase, not the browser.
[functions.send-auth-email]
verify_jwt = false

[functions.create-subscription-checkout]
verify_jwt = true

[functions.create-credits-checkout]
verify_jwt = true

[functions.reconcile-subscription-status]
verify_jwt = true

[functions.ai-optimize]
verify_jwt = true

[functions.ai-generate-index]
verify_jwt = true

[functions.ai-generate-content]
verify_jwt = true

[functions.manuscript-upload-parse]
verify_jwt = true

[functions.ai-split-proposal]
verify_jwt = true

[functions.approve-alignment]
verify_jwt = true

[functions.reset-avatar-problem-content]
verify_jwt = true

[functions.generate-document-template]
verify_jwt = true

[functions.export-pdf]
verify_jwt = true

[functions.export-pdf-queue]
verify_jwt = true

[functions.image-generate]
verify_jwt = true

[functions.export-user-data]
verify_jwt = true

[functions.delete-account]
verify_jwt = true

[functions.export-zip]
verify_jwt = true

# ── Storage buckets ───────────────────────────────────────────────────────────
# Buckets are private by default (public = false); access via signed URLs only.
# RLS policies are defined in migrations (project_images table) and inside
# Edge Function handlers (service role key for project-pdfs / project-zips).

[storage.buckets.project-images]
public = false
file_size_limit = "5MiB"
allowed_mime_types = ["image/png", "image/jpeg", "image/webp"]

[storage.buckets.project-pdfs]
public = false
file_size_limit = "55MiB"
allowed_mime_types = ["application/pdf"]

[storage.buckets.project-zips]
public = false
file_size_limit = "200MiB"
allowed_mime_types = ["application/zip"]
