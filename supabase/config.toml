# Supabase CLI — Obra monorepo (migrations + Edge Functions).
# Docs: https://supabase.com/docs/guides/cli/config

project_id = "obra_app"

[api]
enabled = true

[db]
# Match linked project (see `supabase link` / `.temp/postgres-version` after link).
major_version = 17

# Webhooks must validate Mercado Pago signatures; JWT is not used on this path.
[functions.mercadopago-webhook]
verify_jwt = false

[functions.create-subscription-checkout]
verify_jwt = false

[functions.create-credits-checkout]
verify_jwt = false

[functions.reconcile-subscription-status]
verify_jwt = false

[functions.send-auth-email]
verify_jwt = false

[functions.ai-optimize]
verify_jwt = true

[functions.ai-generate-index]
verify_jwt = true

[functions.ai-generate-content]
verify_jwt = true

[functions.manuscript-upload-parse]
verify_jwt = true

# Validates session inside handler via auth.getUser (same pattern as export-user-data).
[functions.reset-avatar-problem-content]
verify_jwt = false

[functions.export-pdf]
verify_jwt = true

[functions.export-user-data]
verify_jwt = false

[functions.delete-account]
verify_jwt = false
