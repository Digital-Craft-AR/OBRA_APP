# Railway Configuration for PDF Export Worker
# Reference: https://docs.railway.app/reference/config-as-code

[build]
builder = "dockerfile"
buildCommand = "npm ci --omit=dev"

[deploy]
startCommand = "node index.js"
healthchecks = { readiness = { path = "/health", interval = 30 } }

# Port configuration
port = 3000

[environmentVariables]
# ============================================================================
# SUPABASE CONFIGURATION (Get from https://app.supabase.com → Settings → API)
# ============================================================================

# Your Supabase project URL
# Example: https://xyzabc123.supabase.co
SUPABASE_URL = ""

# Service Role Key (MUST be marked as Secret in Railway dashboard)
# Get from: https://app.supabase.com → Settings → API → Service role key
# This allows the worker to access all tables and bypass RLS
SUPABASE_SERVICE_ROLE_KEY = "sb_secret_4eBLzQaWipR3KD7_aUCA5Q_LwWWiqsk"

# Storage bucket name for PDF uploads
# Must exist in Supabase Storage
PROJECT_PDFS_BUCKET = "project-pdfs"

# ============================================================================
# PUPPETEER CONFIGURATION
# ============================================================================

# Timeout for PDF rendering in milliseconds (max 55s for Railway)
PUPPETEER_TIMEOUT_MS = "55000"

# Path to Chromium binary in Docker container
PUPPETEER_EXECUTABLE_PATH = "/usr/bin/chromium"

# ============================================================================
# CRON SECURITY (MUST be marked as Secret in Railway dashboard)
# ============================================================================

# Secret token for authorizing cron job requests
# Must match the Authorization: Bearer header in cron trigger
CRON_SECRET = "1f82fe2d4e44f7e1f9dea0fbd1ad9ce9756142fe4f277b364921c5a11f54df31"

# ============================================================================
# ENVIRONMENT & LOGGING
# ============================================================================

# Node environment
NODE_ENV = "production"

# Log level: debug, info, warn, error
LOG_LEVEL = "info"

# Port for Express server
PORT = "3000"

# ============================================================================
# RESOURCE LIMITS (Railway free tier: 0.5 CPU, 512MB memory)
# ============================================================================

[deploy.limits]
cpus = "0.5"
memory = "512MB"

# ============================================================================
# CRON JOB CONFIGURATION
# Processes PDF exports every 30 seconds
# ============================================================================

[[crons]]
name = "Process PDF Export Jobs"
schedule = "*/30 * * * *"  # Every 30 seconds
command = "curl -X POST http://localhost:3000/process -H 'Authorization: Bearer $CRON_SECRET' -H 'Content-Type: application/json'"
