version: '3.8'

services:
  pdf-export-worker:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: pdf-export-worker

    ports:
      - "3000:3000"

    environment:
      # ========================================================================
      # SUPABASE CONFIGURATION
      # ========================================================================
      # Get these from: https://app.supabase.com → Select project → Settings → API

      # Your Supabase project URL
      # Example: https://xyzabc123.supabase.co
      SUPABASE_URL: ${SUPABASE_URL:-https://your-project.supabase.co}

      # Service Role Key (for full database access, bypasses RLS)
      # Get from: https://app.supabase.com → Settings → API → Service role key
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...}

      # Anon key (optional, for public/authenticated access)
      # Get from: https://app.supabase.com → Settings → API → Anon public key
      # SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}

      # Storage bucket for PDF uploads
      PROJECT_PDFS_BUCKET: ${PROJECT_PDFS_BUCKET:-project-pdfs}

      # ========================================================================
      # PUPPETEER CONFIGURATION
      # ========================================================================

      # Timeout for PDF rendering (milliseconds)
      PUPPETEER_TIMEOUT_MS: ${PUPPETEER_TIMEOUT_MS:-55000}

      # Path to Chromium in Docker container
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/chromium

      # ========================================================================
      # CRON SECURITY
      # ========================================================================

      # Secret token for cron authorization
      CRON_SECRET: ${CRON_SECRET:-dev-secret-token}

      # ========================================================================
      # ENVIRONMENT & LOGGING
      # ========================================================================

      # Node environment (development for local testing)
      NODE_ENV: ${NODE_ENV:-development}

      # Log level: debug, info, warn, error
      # Use debug for local development
      LOG_LEVEL: ${LOG_LEVEL:-debug}

      # Express port
      PORT: 3000

      # Railway environment (ignored locally)
      # RAILWAY_ENVIRONMENT: development

    # Health check to verify container is running
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    # Resource limits for local development
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1024M
        reservations:
          cpus: '0.5'
          memory: 512M

    # Auto-restart on failure
    restart: unless-stopped

    # Optional volumes for development
    # volumes:
    #   - ./src:/app/src  # Hot-reload source code changes
    #   - ./node_modules:/app/node_modules

# ============================================================================
# HOW TO USE
# ============================================================================
#
# 1. Create a .env file with your values:
#    cp .env.example .env
#    # Edit .env with your Supabase credentials
#
# 2. Start the container:
#    docker-compose up --build
#
# 3. Test the health endpoint:
#    curl http://localhost:3000/health
#
# 4. Test manual processing:
#    curl -X POST http://localhost:3000/process \
#      -H "Authorization: Bearer dev-secret-token" \
#      -H "Content-Type: application/json"
#
# 5. View logs:
#    docker-compose logs -f
#
# 6. Stop the container:
#    docker-compose down
